name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run self-tests
        shell: powershell
        run: |
          .\Build.ps1
          .\Build.ps1 -Check -Test

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read script version
        id: version
        shell: pwsh
        run: |
          $source = Get-Content src/bootstrap/Parameters.ps1 -Raw
          $version = ([regex]::Match($source, "VfcVersion\s*=\s*'([^']+)'")).Groups[1].Value
          if (-not $version) { throw 'Could not read the script version from src/bootstrap/Parameters.ps1.' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Check whether this version is already released
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VFC_VERSION: ${{ steps.version.outputs.version }}
        run: |
          # A plain REST lookup avoids native-command stderr/exit-code quirks
          # under the action shell's ErrorActionPreference=Stop.
          $tag = 'v' + $env:VFC_VERSION
          $headers = @{ Authorization = 'Bearer ' + $env:GH_TOKEN; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $released = $false
          try {
            $null = Invoke-RestMethod -Uri ('https://api.github.com/repos/{0}/releases/tags/{1}' -f $env:GITHUB_REPOSITORY, $tag) -Headers $headers -ErrorAction Stop
            $released = $true
          } catch { }
          if ($released) {
            Write-Host "$tag is already released; skipping."
            "release=false" >> $env:GITHUB_OUTPUT
          } else {
            "release=true" >> $env:GITHUB_OUTPUT
          }
      - name: Build release script
        if: steps.check.outputs.release == 'true'
        shell: pwsh
        run: .\Build.ps1
      - name: Build install bootstrap
        if: steps.check.outputs.release == 'true'
        shell: pwsh
        env:
          VFC_VERSION: ${{ steps.version.outputs.version }}
        run: |
          # GitHub serves release assets as application/octet-stream, which
          # Windows PowerShell 5.1 decodes as Latin-1 and corrupts the UTF-8
          # payload (BOM becomes "ï»¿" and localized text breaks). This ASCII
          # bootstrap is immune to that: it re-fetches the real script and
          # decodes it as UTF-8 before invoking it.
          $target = 'https://github.com/{0}/releases/download/v{1}/VGUIFontChanger.ps1' -f $env:GITHUB_REPOSITORY, $env:VFC_VERSION
          $bootstrap = @'
$b=irm '__TARGET__';if($b -is [byte[]]){$t=[Text.Encoding]::UTF8.GetString($b)}elseif($b -is [string] -and $b.Length -gt 2 -and [int]$b[0] -eq 239 -and [int]$b[1] -eq 187 -and [int]$b[2] -eq 191){$t=[Text.Encoding]::UTF8.GetString([Text.Encoding]::GetEncoding(28591).GetBytes($b))}else{$t=[string]$b};if($t.Length -and $t[0] -eq [char]0xFEFF){$t=$t.Substring(1)};iex $t
'@
          $bootstrap = $bootstrap.Replace('__TARGET__', $target)
          [IO.File]::WriteAllText((Join-Path $PWD 'bootstrap.ps1'), $bootstrap, (New-Object Text.ASCIIEncoding))
      - name: Collect release notes
        if: steps.check.outputs.release == 'true'
        shell: pwsh
        env:
          VFC_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $tag = 'v' + $env:VFC_VERSION
          $previous = @(git tag --list 'v*' --sort=-v:refname | Select-Object -First 1)[0]
          $repo = 'https://github.com/' + $env:GITHUB_REPOSITORY
          # The tag for this version does not exist yet, so the newest existing
          # version tag is the previous release; without any tag, list everything.
          $range = if ($previous) { '{0}..HEAD' -f $previous } else { 'HEAD' }
          $format = ('- [`%h`]({0}/commit/%H) %s' -f $repo)
          $commits = @(git log $range --no-decorate --pretty="format:$format")
          # Group commits under a header per Conventional Commits type.
          $order = 'feat', 'fix', 'perf', 'refactor', 'docs', 'test', 'build', 'ci', 'chore'
          $headers = @{ feat = 'Features'; fix = 'Fixes'; perf = 'Performance'; refactor = 'Refactoring'; docs = 'Documentation'; test = 'Tests'; build = 'Build'; ci = 'CI'; chore = 'Chores' }
          $groups = [ordered]@{}
          foreach ($line in $commits) {
            $subject = if ($line -match '^\- \[`[^`]+`\]\([^)]+\) (.*)$') { $Matches[1] } else { $line }
            $type = if ($subject -match '^([a-zA-Z]+)(\([^)]*\))?!?:') { $Matches[1].ToLowerInvariant() } else { '' }
            $key = if ($headers.ContainsKey($type)) { $type } else { 'other' }
            if (-not $groups.Contains($key)) { $groups[$key] = [System.Collections.Generic.List[string]]::new() }
            $groups[$key].Add($line)
          }
          $notes = [System.Collections.Generic.List[string]]@('## Changes', '')
          foreach ($key in ($order + 'other')) {
            if (-not $groups.Contains($key)) { continue }
            $title = if ($key -eq 'other') { 'Other changes' } else { $headers[$key] }
            $notes.Add('### ' + $title); $notes.Add('')
            foreach ($line in $groups[$key]) { $notes.Add($line) }
            $notes.Add('')
          }
          [IO.File]::WriteAllText((Join-Path $PWD 'release-notes.md'), ($notes -join [Environment]::NewLine), (New-Object Text.UTF8Encoding($false)))
      - name: Create release
        if: steps.check.outputs.release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VFC_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $tag = 'v' + $env:VFC_VERSION
          gh release create $tag VGUIFontChanger.ps1 bootstrap.ps1 --title "VGUIFontChanger $tag" --notes-file release-notes.md
